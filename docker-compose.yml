services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  db_dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  tests:
    build: .
    depends_on:
      db_test:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@db_test:5432/app_test
      DATABASE_URL: postgresql://postgres:postgres@db_test:5432/app_test
    command: pytest -v

  api:
    build: .
    depends_on:
      db_dev:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db_dev:5432/app
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && python -m scripts.criar_admin && uvicorn app.main:app --host 0.0.0.0 --port 8000"